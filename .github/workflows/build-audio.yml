name: Build audio sprite
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/build-audio.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-audio
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese TTS engine
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q open-jtalk open-jtalk-mecab-naist-jdic ffmpeg unzip
          curl -sL -o /tmp/tohoku.zip https://codeload.github.com/icn-lab/htsvoice-tohoku-f01/zip/refs/heads/master
          unzip -o -q /tmp/tohoku.zip -d /tmp
      - name: Synthesize and audit every clip
        run: |
          python3 - << 'PY'
          # -*- coding: utf-8 -*-
          # 合成規則:純假名 -> 片假名字面(逐拍正確);問候語保持原文;句子套用讀音修正
          # 稽核閘門:逐句取音素與標準答案比對,任何一句不符 -> 建置失敗
          import re, json, subprocess, os, struct, wave, sys
          s = open("index.html", encoding="utf-8").read()
          texts = set()
          kana_set = set(); vocab_set = set(); grammar_set = set(); vocab_n4_set = set(); grammar_n4_set = set(); vocab_n3_set = set(); grammar_n3_set = set()
          m = re.search(r'const SEION_H = \[\.\.\."([^"]+)"\]', s); kana_set.update(list(m.group(1)))
          m = re.search(r'const SEION_K = \[\.\.\."([^"]+)"\]', s); kana_set.update(list(m.group(1)))
          m = re.search(r'const DAK_H = \[\.\.\."([^"]+)"\]', s); kana_set.update(list(m.group(1)))
          m = re.search(r'const DAK_K = \[\.\.\."([^"]+)"\]', s); kana_set.update(list(m.group(1)))
          m = re.search(r'const YOU_H = \[([^\]]+)\]', s); kana_set.update(re.findall(r'"([^"]+)"', m.group(1)))
          m = re.search(r'const YOU_K = \[([^\]]+)\]', s); kana_set.update(re.findall(r'"([^"]+)"', m.group(1)))
          texts.update(kana_set)
          vb = s.split("const VOCAB = {")[1].split("};")[0]
          for row in re.findall(r'\["([^"]+)","[^"]*","[^"]*","[^"]*"\]', vb):
              texts.add(row); vocab_set.add(row)
          if "const VOCAB_N4 = {" in s:
              vb4 = s.split("const VOCAB_N4 = {")[1].split("\n};")[0]
              for row in re.findall(r'\["([^"]+)","[^"]*","[^"]*","[^"]*"\]', vb4):
                  texts.add(row); vocab_n4_set.add(row)
          if "const VOCAB_N3 = {" in s:
              vb3 = s.split("const VOCAB_N3 = {")[1].split("\n};")[0]
              for row in re.findall(r'\["([^"]+)","[^"]*","[^"]*","[^"]*"\]', vb3):
                  texts.add(row); vocab_n3_set.add(row)
          ro_map = {}
          pb = s.split("const PHRASES = {")[1].split("};")[0]
          for jp, ro in re.findall(r'\["([^"]+)","([^"]+)","[^"]*"\]', pb):
              texts.add(jp); ro_map[jp] = ro
          if "const DOJO = [" in s:
              db = s.split("const DOJO = [")[1].split("\n];")[0]
              for jp, ro in re.findall(r'\["([^"]+)","([^"]+)","[^"]*"\]', db):
                  texts.add(jp); ro_map[jp] = ro
          if "const GRAMMAR = {" in s:
              gb = s.split("const GRAMMAR = {")[1].split("\n};")[0]
              for jp, ro in re.findall(r'\["([^"]+)","([^"]+)","[^"]*"\]', gb):
                  texts.add(jp); ro_map[jp] = ro; grammar_set.add(jp)
          if "const GRAMMAR_N4 = {" in s:
              gb4 = s.split("const GRAMMAR_N4 = {")[1].split("\n};")[0]
              for jp, ro in re.findall(r'\["([^"]+)","([^"]+)","[^"]*"\]', gb4):
                  texts.add(jp); ro_map[jp] = ro; grammar_n4_set.add(jp)
          if "const GRAMMAR_N3 = {" in s:
              gb3 = s.split("const GRAMMAR_N3 = {")[1].split("\n};")[0]
              for jp, ro in re.findall(r'\["([^"]+)","([^"]+)","[^"]*"\]', gb3):
                  texts.add(jp); ro_map[jp] = ro; grammar_n3_set.add(jp)
          texts.add("こんにちは")
          texts = sorted(texts)
          VOICE = "/tmp/htsvoice-tohoku-f01-master/tohoku-f01-neutral.htsvoice"
          DIC = "/var/lib/mecab/dic/open-jtalk/naist-jdic"
          MORA = {}
          for k, p in [("あ","a"),("い","i"),("う","u"),("え","e"),("お","o"),("か","k a"),("き","k i"),("く","k u"),("け","k e"),("こ","k o"),("さ","s a"),("し","sh i"),("す","s u"),("せ","s e"),("そ","s o"),("た","t a"),("ち","ch i"),("つ","ts u"),("て","t e"),("と","t o"),("な","n a"),("に","n i"),("ぬ","n u"),("ね","n e"),("の","n o"),("は","h a"),("ひ","h i"),("ふ","f u"),("へ","h e"),("ほ","h o"),("ま","m a"),("み","m i"),("む","m u"),("め","m e"),("も","m o"),("や","y a"),("ゆ","y u"),("よ","y o"),("ら","r a"),("り","r i"),("る","r u"),("れ","r e"),("ろ","r o"),("わ","w a"),("を","o"),("ん","N"),("が","g a"),("ぎ","g i"),("ぐ","g u"),("げ","g e"),("ご","g o"),("ざ","z a"),("じ","j i"),("ず","z u"),("ぜ","z e"),("ぞ","z o"),("だ","d a"),("ぢ","j i"),("づ","z u"),("で","d e"),("ど","d o"),("ば","b a"),("び","b i"),("ぶ","b u"),("べ","b e"),("ぼ","b o"),("ぱ","p a"),("ぴ","p i"),("ぷ","p u"),("ぺ","p e"),("ぽ","p o"),("きゃ","ky a"),("きゅ","ky u"),("きょ","ky o"),("しゃ","sh a"),("しゅ","sh u"),("しょ","sh o"),("ちゃ","ch a"),("ちゅ","ch u"),("ちょ","ch o"),("にゃ","ny a"),("にゅ","ny u"),("にょ","ny o"),("ひゃ","hy a"),("ひゅ","hy u"),("ひょ","hy o"),("みゃ","my a"),("みゅ","my u"),("みょ","my o"),("りゃ","ry a"),("りゅ","ry u"),("りょ","ry o"),("ぎゃ","gy a"),("ぎゅ","gy u"),("ぎょ","gy o"),("じゃ","j a"),("じゅ","j u"),("じょ","j o"),("びゃ","by a"),("びゅ","by u"),("びょ","by o"),("ぴゃ","py a"),("ぴゅ","py u"),("ぴょ","py o")]:
              MORA[k] = p.split()
          def hira(t): return "".join(chr(ord(c)-0x60) if "ァ" <= c <= "ヶ" else c for c in t)
          def kata(t): return "".join(chr(ord(c)+0x60) if "ぁ" <= c <= "ゖ" else c for c in t)
          def is_pure_kana(t):
              return all(("ぁ" <= c <= "ゖ") or ("ァ" <= c <= "ヶ") or c == "ー" for c in t)
          def mora_expect(t):
              t = hira(t); out = []; i = 0
              while i < len(t):
                  if i+1 < len(t) and t[i:i+2] in MORA: out += MORA[t[i:i+2]]; i += 2; continue
                  c = t[i]
                  if c == "っ": out.append("cl")
                  elif c == "ー": out.append(out[-1])
                  else: out += MORA[c]
                  i += 1
              return out
          DIG = {"shi":"sh i","chi":"ch i","tsu":"ts u","che":"ch e","she":"sh e","je":"j e","sha":"sh a","shu":"sh u","sho":"sh o","cha":"ch a","chu":"ch u","cho":"ch o","ja":"j a","ju":"j u","jo":"j o","ji":"j i","kya":"ky a","kyu":"ky u","kyo":"ky o","gya":"gy a","gyu":"gy u","gyo":"gy o","nya":"ny a","nyu":"ny u","nyo":"ny o","hya":"hy a","hyu":"hy u","hyo":"hy o","mya":"my a","myu":"my u","myo":"my o","rya":"ry a","ryu":"ry u","ryo":"ry o","bya":"by a","byu":"by u","byo":"by o","pya":"py a","pyu":"py u","pyo":"py o","fa":"f a","fi":"f i","fe":"f e","fo":"f o","fu":"f u","wa":"w a","wo":"o","wi":"w i","ya":"y a","yu":"y u","yo":"y o"}
          def romaji_to_ph(r):
              r = r.lower().replace("-","").replace("'","").replace(" ","|")
              out, i = [], 0
              singles = set("aiueo"); cons = set("kgsztdnhbpmrwfyj")
              while i < len(r):
                  if r[i] == "|": i += 1; continue
                  hit = None
                  for L in (3, 2):
                      if r[i:i+L] in DIG: hit = (DIG[r[i:i+L]], L); break
                  if hit: out += hit[0].split(); i += hit[1]; continue
                  c = r[i]
                  if c in singles: out.append(c); i += 1; continue
                  if c == "n" and (i+1 >= len(r) or r[i+1] not in "aiueoy"):
                      out.append("N"); i += 1; continue
                  if c in cons and i+1 < len(r) and r[i+1] == c: out.append("cl"); i += 1; continue
                  if c in cons and i+1 < len(r) and r[i+1] in singles: out += [c, r[i+1]]; i += 2; continue
                  i += 1
              return out
          def fold(phs):
              phs = ["i" if p == "I" else "u" if p == "U" else p for p in phs]
              out = []
              for p in phs:
                  if out and out[-1] == "o" and p in ("u", "o"): out.append("o"); continue
                  if out and out[-1] == "e" and p in ("i", "e"): out.append("e"); continue
                  out.append(p)
              return out
          KEEP = {"こんにちは": "konnichiwa", "こんばんは": "konbanwa"}
          KANA_FIX = {"さんぎょう": "産業", "ゆしゅつします": "輸出します", "ゆにゅうします": "輸入します", "きょうりょく": "協力", "ぼしゅうします": "募集します"}  # 片假名字面被誤斷詞時,改用漢字合成(標準答案不變)
          SENT_FIX = [("何ですか", "なんですか"), ("何でしょうか", "なんでしょうか"), ("日本の", "にほんの"), ("日本へ", "にほんへ"), ("日本に", "にほんに"), ("日本で", "にほんで"), ("お帰りに", "おかえりに")]
          plan = []
          for t in texts:
              if t in KEEP: plan.append((t, t, romaji_to_ph(KEEP[t]), "0.8"))
              elif is_pure_kana(t):
                  rate = "0.65" if len(hira(t)) <= 2 else "0.75"
                  plan.append((t, KANA_FIX.get(t, kata(t)), mora_expect(t), rate))
              else:
                  st = t
                  for a, b in SENT_FIX: st = st.replace(a, b)
                  plan.append((t, st, romaji_to_ph(ro_map[t]), "0.8"))
          def synth(text, out, rate):
              open("/tmp/in.txt", "w", encoding="utf-8").write(text)
              subprocess.run(["open_jtalk", "-x", DIC, "-m", VOICE, "-r", rate, "-ow", out, "-ot", "/tmp/trace.txt", "/tmp/in.txt"],
                             check=True, capture_output=True)
          def trace_phonemes():
              tr = open("/tmp/trace.txt", encoding="utf-8", errors="ignore").read()
              lab = tr.split("[Output label]")[1].split("[")[0]
              return [m.group(1) for line in lab.strip().splitlines()
                      for m in [re.search(r"\-([a-zA-Z]+)\+", line)] if m and m.group(1) not in ("sil", "pau")]
          def read_wav(path):
              w = wave.open(path, "rb"); sr = w.getframerate()
              data = w.readframes(w.getnframes()); w.close(); return sr, data
          def trim(data, sr, thresh=300):
              n = len(data)//2
              samples = struct.unpack("<%dh" % n, data)
              st, en = 0, n
              for i in range(n):
                  if abs(samples[i]) > thresh: st = max(0, i - int(sr*0.02)); break
              for i in range(n-1, -1, -1):
                  if abs(samples[i]) > thresh: en = min(n, i + int(sr*0.06)); break
              return struct.pack("<%dh" % (en-st), *samples[st:en])
          # ---- 分片:kana / vocab_n5 / grammar_n5 / phrases;各分片指紋比對,沒變就跳過 ----
          import hashlib
          def shard_of(t):
              if t in grammar_n3_set: return "grammar_n3"
              if t in grammar_n4_set: return "grammar_n4"
              if t in grammar_set: return "grammar_n5"
              if t in vocab_n3_set: return "vocab_n3"
              if t in vocab_n4_set: return "vocab_n4"
              if t in vocab_set: return "vocab_n5"
              if t in kana_set: return "kana"
              return "phrases"
          by_shard = {}
          for item in plan: by_shard.setdefault(shard_of(item[0]), []).append(item)
          os.makedirs("audio", exist_ok=True)
          manifest = {"__fmt": 2, "shards": {}, "index": {}}
          rebuilt = []
          total_clips = 0
          for sh in sorted(by_shard):
              items = sorted(by_shard[sh])
              total_clips += len(items)
              fp = hashlib.sha256("\n".join("%s|%s" % (it[0], it[3]) for it in items).encode("utf-8")).hexdigest()[:12]
              old = None
              try: old = json.load(open("audio/%s.json" % sh, encoding="utf-8"))
              except Exception: pass
              if old and old.get("__fp") == fp and os.path.exists("audio/%s.mp3" % sh):
                  manifest["shards"][sh] = {"v": old["__v"]}
                  for k, sd in old["map"].items(): manifest["index"][k] = [sh, sd[0], sd[1]]
                  print("shard %-11s unchanged (%d clips) -> skip" % (sh, len(items)))
                  continue
              sr0 = None; segments = []; out_pcm = bytearray(); GAP = b""; fails = []
              for key, synth_text, exp, rate in items:
                  synth(synth_text, "/tmp/c.wav", rate)
                  got = fold(trace_phonemes())
                  if got != fold(exp):
                      fails.append((key, " ".join(fold(exp)), " ".join(got)))
                  sr, data = read_wav("/tmp/c.wav")
                  if sr0 is None:
                      sr0 = sr; GAP = b"\x00\x00" * int(sr*0.25)
                  data = trim(data, sr)
                  segments.append((key, len(out_pcm)//2, len(data)//2))
                  out_pcm += data; out_pcm += GAP
              if fails:
                  print("AUDIT FAILED [%s] — %d clip(s) mispronounced:" % (sh, len(fails)))
                  for k, e, g in fails: print("  [%s] expect(%s) got(%s)" % (k, e, g))
                  sys.exit(1)
              w = wave.open("/tmp/%s.wav" % sh, "wb")
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr0)
              w.writeframes(bytes(out_pcm)); w.close()
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", "/tmp/%s.wav" % sh,
                              "-ac", "1", "-ar", "22050", "-b:a", "32k", "audio/%s.mp3" % sh], check=True)
              ver = hashlib.sha256(open("audio/%s.mp3" % sh, "rb").read()).hexdigest()[:10]
              mp = {k: [round(st/sr0*1000), round(d/sr0*1000)] for k, st, d in segments}
              json.dump({"__fp": fp, "__v": ver, "map": mp}, open("audio/%s.json" % sh, "w", encoding="utf-8"),
                        ensure_ascii=False, separators=(",", ":"))
              manifest["shards"][sh] = {"v": ver}
              for k, sd in mp.items(): manifest["index"][k] = [sh, sd[0], sd[1]]
              rebuilt.append(sh)
              print("shard %-11s AUDIT PASSED %d/%d clips, %.1fs, ver %s" % (sh, len(items), len(items), len(out_pcm)/2/sr0, ver))
          manifest["__v"] = hashlib.sha256(json.dumps(manifest["index"], sort_keys=True, ensure_ascii=False).encode("utf-8")).hexdigest()[:10]
          json.dump(manifest, open("audio/sprite_map.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          if os.path.exists("audio/sprite.mp3"): os.remove("audio/sprite.mp3")
          print("clips total: %d / rebuilt shards: %s / map ver: %s" % (total_clips, ",".join(rebuilt) or "none", manifest["__v"]))
          PY
          ls -la audio/
      - name: Commit audio back to repo
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add -A audio
          git diff --cached --quiet || (git commit -m "Build audio shards (auto, audited)" && git push)
